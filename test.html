<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tic-Tac-Toe Example</title>
    <style>
        .nav-mesh {
            display: none;
        }
    </style>
</head>

<body>
    <a-scene></a-scene>
    <script>
        // A big sphere round the space with a sky picture on its inside.
        // Called from createFloor, so it is made once, at the same time as the floor.
        async function createSky() {
            const sky = await new BS.GameObject({ name: "BanterSky" }).Async();
            await sky.AddComponent(new BS.BanterSphere({ radius: 300 }));
            await sky.AddComponent(new BS.BanterInvertedMesh()); // Faces inwards, so it shows from inside
            await sky.AddComponent(new BS.BanterMaterial({
                shaderName: "Unlit/Diffuse",
                texture: "https://drop.firer.at/Assets/skybox-4k-zc.jpg",
                color: new BS.Vector4(1, 1, 1, 1),
                side: BS.MaterialSide.Front
            }));
            await sky.AddComponent(new BS.Transform());
        }

        async function createFloor() {
            createSky();
            const floor = await new BS.GameObject("BanterFloor").Async();
            const width = 30; const height = 0.1; const depth = 30;

            const geoArgs = [BS.GeometryType.BoxGeometry, null, width, height, depth, 1, 1, 1, 0.5, 24, 0, 6.28, 0, 6.28, 8, false, 0.5, 0.5, 0, 1, 24, 8, 0.4, 16, 6.28, 2, 3, 5, 5, 0, ""];
            await floor.AddComponent(new BS.BanterGeometry(...geoArgs));

            const texUrl = "https://cdn.aframe.io/a-painter/images/floor.jpg";
            await floor.AddComponent(new BS.BanterMaterial("Unlit/Texture", texUrl, new BS.Vector4(1, 1, 1, 1), BS.MaterialSide.Front, true));
            await floor.AddComponent(new BS.BoxCollider(false, new BS.Vector3(0, 0, 0), new BS.Vector3(width, height, depth)));

            let transform = floor.GetComponent(BS.ComponentType.Transform);
            if (!transform) transform = await floor.AddComponent(new BS.Transform());
            transform.localPosition = new BS.Vector3(0, -0.05, 0); // Flush with 0
        }

        window.addEventListener("bs-loaded", async () => {
            createFloor();
        });
    </script>
    <!-- 
       Tic-Tac-Toe embed
       Customize via URL params in the src attribute!
    -->
    <script src="TicTacToe.js?boardPosition=0+0.7+-2&boardScale=0.7&useCustomModels=true&lighting=lit&addLights=true&hideBoard=false"></script>
</body>

</html>
